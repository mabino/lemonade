name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Engine, art and door tests (in a container)
        run: |
          docker build -t lemonade-test .
          docker run --rm lemonade-test
      - name: Art module matches its generator
        run: python3 tools/make_art.py --check
