name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Engine tests (in a container)
        run: |
          docker build -t lemonade-test .
          docker run --rm lemonade-test
      - name: Door script parses as JavaScript
        run: docker run --rm -v "$PWD/src:/src:ro" node:22-alpine node --check /src/lemonade.js
